<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gesture Boxing Web</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="screenRoot" class="screen-root"></main>

    <dialog id="cropModal" class="crop-modal">
      <form method="dialog" class="crop-modal-card">
        <div class="crop-modal-head">
          <div>
            <p class="eyebrow">Upload Head</p>
            <h3 id="cropTitle">Crop Portrait</h3>
          </div>
          <button class="ghost-button" value="cancel">Close</button>
        </div>

        <div class="crop-layout">
          <div class="crop-stage">
            <canvas id="cropCanvas" width="320" height="320"></canvas>
          </div>
          <div class="crop-controls">
            <label class="slider-field">
              <span>Zoom</span>
              <input id="cropZoom" type="range" min="1" max="3" step="0.01" value="1.2" />
            </label>
            <label class="slider-field">
              <span>Horizontal</span>
              <input id="cropOffsetX" type="range" min="-120" max="120" step="1" value="0" />
            </label>
            <label class="slider-field">
              <span>Vertical</span>
              <input id="cropOffsetY" type="range" min="-120" max="120" step="1" value="0" />
            </label>
            <label class="upload-drop">
              <input id="photoInput" type="file" accept="image/*" />
              <span>Choose photo</span>
              <small>PNG, JPG, WEBP all work here.</small>
            </label>
            <div class="crop-actions">
              <button id="saveCropButton" type="button" class="primary-button">Save Head</button>
            </div>
          </div>
        </div>
      </form>
    </dialog>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
